name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MagicWorldImporter-source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q MagicWorldImporter-source.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: MagicWorldImporter
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MagicWorldImporter-APK
          path: MagicWorldImporter/app/build/outputs/apk/debug/app-debug.apk
